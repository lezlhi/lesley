<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      background: #ffe6ea;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      color: #d6336c;
      font-size: 36px;
    }

    p {
      font-size: 20px;
      color: #333;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
    }

    #noBtn {
      background-color: #ccc;
    }
  </style>
</head>
<body>

  <h1>Erica Abla Senaya ❤️</h1>
  <p>Will you be my Valentine?</p>

  <button id="yesBtn" onclick="yesClicked()">
    YES 💕
  </button>

  <button id="noBtn" onclick="noClicked()">
    NO 😅
  </button>

  <script>
    let size = 20;

    function noClicked() {
      size += 10;
      const yesBtn = document.getElementById("yesBtn");
      yesBtn.style.fontSize = size + "px";
      yesBtn.style.padding = (size / 2) + "px " + size + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <h1 style="color:#d6336c;">Yayyy! 💖</h1>
        <p style="font-size:22px;">You just made my Valentine special 😊</p>
      `;
    }
  </script>

</body>
</html>
